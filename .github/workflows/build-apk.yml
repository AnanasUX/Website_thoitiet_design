name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Verify Android SDK
        run: |
          echo "Using preinstalled Android SDK at $ANDROID_HOME"

      - name: Install dependencies
        run: npm install

      - name: Build web assets for App
        run: npm run build
        env:
          BUILD_TARGET: 'app'

      - name: Sync with Capacitor Android
        run: |
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/AnX-ThoiTiet.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnX-ThoiTiet-APK
          path: release-apk/AnX-ThoiTiet.apk
          if-no-files-found: error
