name: QA Registry Gate
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run qa:registry
      - run: npm run qa:dashboard
      - run: npm run test:logic
