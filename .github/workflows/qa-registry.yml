name: QA Registry Gate
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions: write-all

jobs:
  registry:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Ho_Chi_Minh'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install
      - run: npm run qa:registry
      - run: npm run qa:dashboard
      - name: Run logic tests
        run: node scripts/test-logic-flows.mjs > logic-test.log 2>&1 || (cat logic-test.log && exit 1)
      - name: Save debug log to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug/ci-logs
          git add -f logic-test.log || true
          git commit -m "ci: debug logic test output" || true
          git push -f origin debug/ci-logs || true
