name: QA Registry Gate
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Ho_Chi_Minh'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install
      - run: npm run qa:registry
      - run: npm run qa:dashboard
      - name: Run logic tests
        run: node scripts/test-logic-flows.mjs > logic-test.log 2>&1 || (cat logic-test.log && exit 1)
      - name: Upload logic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-test-log
          path: logic-test.log
