<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Đang chuyển hướng...</title>
    <script type="text/javascript">
      (function() {
        var path = window.location.pathname.toLowerCase();
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        if (path.includes('admin')) {
          window.location.replace('/admin_board/' + search + hash);
        } else if (path.includes('tung-kinh') || path.includes('tungkinh')) {
          window.location.replace('/tung-kinh/index.html' + search + hash);
        } else {
          sessionStorage.redirect = window.location.href;
          window.location.replace('/' + search + hash);
        }
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #5f687b;">
      Đang chuyển đến Chùa An Nhiên (Tụng Kinh)...
    </p>
  </body>
</html>
