<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>AnX - Thời Tiết & Tin Tức</title>
    
    <!-- DNS prefetch & Preconnect for ultra-fast YouTube & Media loading -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://wsrv.nl" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://icdn.dantri.com.vn" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://wsrv.nl" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://icdn.dantri.com.vn" />
    
    <!-- WebApp & Mobile Meta Tags -->
    <meta name="theme-color" content="#182033" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnX App" />
    <meta name="application-name" content="AnX App" />
    <meta name="description" content="Ứng dụng thời tiết, tin tức và giá vàng thời gian thực" />

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <script type="text/javascript">
      // GitHub Pages SPA redirect recovery
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <audio id="vieneu-audio-engine" referrerpolicy="no-referrer" preload="none" style="display:none;"></audio>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.__lastUserActivity = Date.now();
      window.__isVideoWatching = false;
      const recordUserActivity = function() {
        window.__lastUserActivity = Date.now();
      };
      window.addEventListener('mousedown', recordUserActivity, { passive: true });
      window.addEventListener('keydown', recordUserActivity, { passive: true });
      window.addEventListener('touchstart', recordUserActivity, { passive: true });
      window.addEventListener('touchmove', recordUserActivity, { passive: true });
      window.addEventListener('wheel', recordUserActivity, { passive: true });
      window.addEventListener('scroll', recordUserActivity, { passive: true });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) {
            r.update();
            if (r.waiting) {
              r.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          }
        });
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          // CHỈ TỰ ĐỘNG TẢI LẠI TRANG KHI NGƯỜI DÙNG HOÀN TOÀN KHÔNG THAO TÁC (IDLE > 60s VÀ KHÔNG XEM SHORTS)
          var checkAndReload = function() {
            var isIdle = (Date.now() - (window.__lastUserActivity || 0)) > 60000;
            var isWatching = Boolean(window.__isVideoWatching);
            if (isIdle && !isWatching) {
              window.location.reload();
            } else {
              setTimeout(checkAndReload, 30000);
            }
          };
          checkAndReload();
        });
      }
    </script>
    <!-- figma:body-end -->
  </body>
</html>
